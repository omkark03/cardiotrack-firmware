; CardioTrack chest hub firmware
; Pick the environment in the PlatformIO status bar (bottom of VS Code).
;
; Per-sensor mock switches (mix and match while bringing up hardware):
;   -DUSE_MOCK_SENSORS   all four sensors mock
;   -DUSE_MOCK_ECG  -DUSE_MOCK_PPG  -DUSE_MOCK_IMU  -DUSE_MOCK_TEMP   (individually)
; Other switches:
;   -DBENCH_MODE         no deep sleep (delay instead) so Serial stays alive
;   -DAPP_ECG_STREAM     just stream raw ECG to Serial Plotter (AD8232 debugging)
;   -DBATTERY_PRESENT    real battery divider on BAT_ADC (PCB only)
;   -DCFG_BURST_SEC=n  -DCFG_CYCLE_SEC=n   shorten timing for bench tests

[platformio]
default_envs = mock_full

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv      ; no OTA -> 2 MB left for the outage queue
build_flags = -Wall
upload_port = COM13
monitor_port = COM13

; ---- Phase A: everything fake, talks to backend_fake/server.py ----
[env:mock_bench]
build_flags = ${env.build_flags} -DBOARD_BREADBOARD_V1 -DUSE_MOCK_SENSORS -DBENCH_MODE -DCFG_BURST_SEC=10 -DCFG_CYCLE_SEC=30

; Same, but with real deep sleep and real 60 s / 300 s timing.
; Jumper GPIO27 to 3V3 to fake a motion wake-up.
[env:mock_full]
build_flags = ${env.build_flags} -DBOARD_BREADBOARD_V1 -DUSE_MOCK_SENSORS

; ---- AD8232 debugging: raw ECG to Serial Plotter ----
[env:stream_mock]
build_flags = ${env.build_flags} -DBOARD_BREADBOARD_V1 -DUSE_MOCK_SENSORS -DAPP_ECG_STREAM

[env:stream_real]
build_flags = ${env.build_flags} -DBOARD_BREADBOARD_V1 -DAPP_ECG_STREAM

; ---- Phase B/C: real sensors on the breadboard ----
; Add -DUSE_MOCK_xxx for any sensor not wired yet.
[env:bb_real_bench]
build_flags = ${env.build_flags} -DBOARD_BREADBOARD_V1 -DBENCH_MODE -DCFG_BURST_SEC=10 -DCFG_CYCLE_SEC=30

; ---- Phase D: final PCB ----
[env:pcb_real]
build_flags = ${env.build_flags} -DBOARD_PCB_V1 -DBATTERY_PRESENT
